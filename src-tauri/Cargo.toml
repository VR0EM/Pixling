[package]
name = "pixling"
version = "0.1.0"
description = "Pixling: een klein pixelmaatje dat op je bureaublad woont"
authors = ["VR0EM"]
edition = "2021"

[lib]
name = "pixling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
