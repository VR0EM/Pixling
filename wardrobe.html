<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wardrobe</title>
  </head>
  <body>
    <main class="wardrobe">
      <header class="hero">
        <canvas id="preview" width="32" height="32" aria-label="Your buddy"></canvas>
        <div>
          <h1>Wardrobe</h1>
          <p id="summary"></p>
          <p class="hint">Everything you pick shows up on your screen right away.</p>
        </div>
      </header>

      <section>
        <h2>Buddy</h2>
        <div id="species" class="cards"></div>
      </section>

      <section>
        <h2>Colour</h2>
        <div id="palettes" class="swatches"></div>
      </section>

      <section>
        <h2>Accessory</h2>
        <div id="accessories" class="pills"></div>
      </section>

      <section class="row">
        <div>
          <h2>Size</h2>
          <div id="scale" class="pills"></div>
        </div>
        <div>
          <h2>Focus length</h2>
          <div id="focus" class="pills"></div>
        </div>
      </section>

      <section>
        <h2>Character</h2>
        <div id="characters" class="characters"></div>
      </section>

      <section>
        <h2>Habits</h2>
        <div id="habits" class="toggles"></div>
      </section>
    </main>
    <script type="module" src="/src/wardrobe.ts"></script>
  </body>
</html>
